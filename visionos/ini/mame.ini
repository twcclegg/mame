#
# Default settings for the visionOS build.  This copy is read from the app
# bundle; put a mame.ini in the app's Documents folder (Files app) to
# override it.
#

# SDL_Renderer (Metal-backed) output is the least risky path for first light.
# Switch to "bgfx" to use bgfx's Metal renderer and its shader chains
# (e.g. bgfx_screen_chains xbr or crt-geom).
video                     accel
sound                     sdl
samplerate                48000

skip_gameinfo             1

# visionos/ctrlr/visionos.cfg: Select + Start opens the MAME menu, since
# visionOS reserves the controller's Guide button
ctrlr                     visionos

# visionOS's Shared Space exposes gaze+pinch to windowed apps as ordinary
# pointer/mouse motion (there's no head-pose/ARKit access outside an
# immersive space). Route spinner/paddle/trackball-style controls to it by
# default, so e.g. Arkanoid's paddle (an IPT_DIAL) is steerable by looking
# left/right, with no per-game setup. -mouse must also be enabled for MAME
# to read the pointer as a mouse at all.
mouse                     1
dial_device               mouse
paddle_device             mouse
trackball_device          mouse
