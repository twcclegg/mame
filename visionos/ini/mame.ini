#
# Default settings for the visionOS build.  This copy is read from the app
# bundle; put a mame.ini in the app's Documents folder (Files app) to
# override it.
#

# SDL_Renderer (Metal-backed) output is the least risky path for first light.
# Switch to "bgfx" to use bgfx's Metal renderer and its shader chains
# (e.g. bgfx_screen_chains xbr or crt-geom).
video                     accel
sound                     sdl
samplerate                48000

skip_gameinfo             1
