<?xml version="1.0"?>
<mameconfig version="10">
	<system name="default">

		<!--
		visionOS reserves the controller's Home/PS/Xbox (Guide) button, which
		MAME's SDL3 gamepad support uses for the menu.  Also open the menu
		with Select + Start (View + Menu on Xbox, Create + Options on PS5).
		-->

		<input>
			<port type="UI_MENU">
				<newseq type="standard">KEYCODE_TAB OR JOYCODE_1_SELECT JOYCODE_1_START</newseq>
			</port>
		</input>
	</system>
</mameconfig>
